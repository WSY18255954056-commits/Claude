{% extends "base.html" %}
{% block title %}{{ '编辑仪器' if item.id else '添加仪器' }}{% endblock %}
{% block content %}
<h1>{{ '编辑仪器' if item.id else '添加仪器' }}</h1>
<form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div><label>名称 *</label><input name="name" required value="{{ item.name or '' }}"></div>
    <div><label>型号</label><input name="model" value="{{ item.model or '' }}"></div>
    <div><label>资产编号</label><input name="serial_no" value="{{ item.serial_no or '' }}"></div>
    <div><label>放置位置</label><input name="location" value="{{ item.location or '' }}"></div>
    <div><label>负责人</label><input name="manager" value="{{ item.manager or '' }}"></div>
    <div><label>状态</label>
      <select name="status">
        {% for s in statuses %}<option {{ 'selected' if s == (item.status or '可用') }}>{{ s }}</option>{% endfor %}
      </select></div>
    <div><label>单次最长预约 (小时, 0 = 不限)</label>
      <input name="max_hours" type="number" min="0" step="0.5" value="{{ item.max_hours or 0 }}"></div>
    <div class="full"><label>说明 / 使用须知</label><textarea name="description">{{ item.description or '' }}</textarea></div>
  </div>
  <p style="margin-bottom:0">
    <button class="btn btn-primary">保存</button>
    <a class="btn" href="{{ url_for('equipment_detail', eid=item.id) if item.id else url_for('equipment_list') }}">返回</a>
  </p>
</form>
{% endblock %}
