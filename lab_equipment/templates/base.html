<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · 实验室仪器管理系统</title>
  <style>
    :root {
      --bg: #f5f7fa; --card: #fff; --text: #1f2933; --muted: #6b7785; --border: #e1e5eb;
      --primary: #2563eb; --primary-weak: #e8efff; --success: #15803d; --warning: #b45309;
      --danger: #b91c1c; --info: #0e7490;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: var(--bg); color: var(--text); }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { background: #1e293b; color: #fff; }
    header .inner { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex;
                    align-items: center; gap: 24px; flex-wrap: wrap; }
    header .brand { font-weight: 600; font-size: 16px; padding: 14px 0; color: #fff; }
    header nav { display: flex; gap: 4px; flex-wrap: wrap; }
    header nav a { color: #cbd5e1; padding: 14px 10px; display: block; }
    header nav a.active, header nav a:hover { color: #fff; text-decoration: none;
                                              box-shadow: inset 0 -3px 0 #60a5fa; }
    main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 16px; display: flex; align-items: center; gap: 12px;
         flex-wrap: wrap; }
    h1 .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap;
                  font-size: 14px; font-weight: normal; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; gap: 16px; }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
    .stat .num { font-size: 28px; font-weight: 600; }
    .stat .label { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border);
             vertical-align: top; }
    th { color: var(--muted); font-weight: 500; background: #fafbfc; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    .table-wrap { overflow-x: auto; }
    .num-col { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .btn { display: inline-block; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
           background: #fff; color: var(--text); cursor: pointer; font: inherit; line-height: 1.4; }
    .btn:hover { background: #f1f4f8; text-decoration: none; }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: var(--success); border-color: var(--success); color: #fff; }
    .btn-success:hover { background: #166534; }
    .btn-danger { color: var(--danger); border-color: #f3c4c4; }
    .btn-sm { padding: 2px 8px; font-size: 13px; }
    form.inline { display: inline; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
             white-space: nowrap; border: 1px solid transparent; }
    .s-可用, .s-已完成 { background: #e7f6ec; color: var(--success); }
    .s-维护中, .s-爽约 { background: #fdf2e3; color: var(--warning); }
    .s-停用, .s-已取消 { background: #f1f2f4; color: var(--muted); }
    .s-已预约 { background: var(--primary-weak); color: var(--primary); }
    .s-使用中 { background: #e0f4f7; color: var(--info); }
    .s-过期 { background: #fdeaea; color: var(--danger); }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; border: 1px solid; }
    .flash-success { background: #effaf2; border-color: #bfe5cb; color: var(--success); }
    .flash-danger { background: #fdf0f0; border-color: #f3c4c4; color: var(--danger); }
    .flash-warning { background: #fdf7ec; border-color: #f2dcb3; color: var(--warning); }
    .flash-info { background: #eef6ff; border-color: #c7dcfb; color: var(--primary); }
    label { display: block; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--border);
                              border-radius: 6px; width: 100%; background: #fff; color: var(--text); }
    textarea { min-height: 70px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                 gap: 12px 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .filters > div { min-width: 140px; }
    .filters input, .filters select { width: auto; min-width: 140px; }
    dl.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0; }
    dl.kv dt { color: var(--muted); }
    dl.kv dd { margin: 0; }
    .empty { color: var(--muted); padding: 16px 0; text-align: center; }
    @media (max-width: 640px) { dl.kv { grid-template-columns: 90px 1fr; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<header>
  <div class="inner">
    <a class="brand" href="{{ url_for('index') }}">🔬 实验室仪器管理系统</a>
    <nav>
      {% set ep = request.endpoint or '' %}
      <a href="{{ url_for('index') }}" class="{{ 'active' if ep == 'index' }}">首页</a>
      <a href="{{ url_for('equipment_list') }}" class="{{ 'active' if ep.startswith('equipment') }}">仪器</a>
      <a href="{{ url_for('reservations') }}" class="{{ 'active' if ep.startswith('reservation') }}">预约与使用</a>
      <a href="{{ url_for('schedule') }}" class="{{ 'active' if ep == 'schedule' }}">日程</a>
      <a href="{{ url_for('users') }}" class="{{ 'active' if ep.startswith('user') }}">使用人</a>
      <a href="{{ url_for('stats') }}" class="{{ 'active' if ep == 'stats' }}">统计</a>
    </nav>
  </div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
